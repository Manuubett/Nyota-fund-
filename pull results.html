<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>One Term or Two? — Results</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap');

  :root{
    --paper:#eef1f0;
    --ink:#16221f;
    --side-a:#1f6f78;
    --side-a-deep:#144a51;
    --side-a-tint:#e2eeee;
    --side-b:#b5502e;
    --side-b-deep:#833a20;
    --side-b-tint:#f6e7e0;
    --line:#c7cfcc;
    --muted:#5b6864;
    --faint:#93a09b;
  }

  *{box-sizing:border-box; margin:0; padding:0;}

  body{
    font-family:'Inter', sans-serif;
    background:var(--paper);
    color:var(--ink);
    min-height:100vh;
    padding:32px 20px 80px;
  }

  .wrap{ width:100%; max-width:860px; margin:0 auto; }

  a.back{
    display:inline-block; font-size:12px; color:var(--muted); text-decoration:none;
    margin-bottom:18px; border-bottom:1px solid var(--line); padding-bottom:1px;
  }
  a.back:hover{ color:var(--ink); border-color:var(--muted); }

  .eyebrow{
    font-size:12px; letter-spacing:0.14em; text-transform:uppercase;
    color:var(--muted); margin-bottom:8px; font-weight:600;
  }

  h1{
    font-family:'Big Shoulders Display', sans-serif;
    font-weight:900; font-size:clamp(34px, 6vw, 52px);
    line-height:0.95; letter-spacing:-0.01em; margin-bottom:22px;
  }

  /* ── Winner banner ── */
  .banner{
    background:#fff; border-radius:16px; padding:26px 26px 22px;
    box-shadow:0 1px 2px rgba(0,0,0,0.06); margin-bottom:28px;
    border-left:6px solid var(--line);
    transition:border-color .4s ease;
  }
  .banner.lead-a{ border-left-color:var(--side-a); }
  .banner.lead-b{ border-left-color:var(--side-b); }

  .banner-top{ display:flex; justify-content:space-between; align-items:baseline; flex-wrap:wrap; gap:10px; margin-bottom:14px; }
  .banner-call{ font-size:12px; letter-spacing:0.1em; text-transform:uppercase; color:var(--muted); font-weight:700; }
  .banner-total{ font-size:12px; color:var(--faint); font-family:'JetBrains Mono', monospace; }

  .banner-winner{
    font-family:'Big Shoulders Display', sans-serif; font-weight:900;
    font-size:clamp(28px, 5vw, 40px); margin-bottom:14px; display:flex; align-items:baseline; gap:12px;
  }
  .banner-winner .margin{ font-size:15px; font-family:'Inter'; font-weight:500; color:var(--muted); }
  .banner-winner.tie{ color:var(--muted); }
  .banner-winner.a{ color:var(--side-a-deep); }
  .banner-winner.b{ color:var(--side-b-deep); }

  .bar-track{ height:20px; background:var(--line); border-radius:10px; overflow:hidden; display:flex; margin-bottom:8px; }
  .bar-a, .bar-b{ height:100%; transition:width .6s cubic-bezier(.4,0,.2,1); }
  .bar-a{ background:linear-gradient(90deg, var(--side-a), var(--side-a-deep)); }
  .bar-b{ background:linear-gradient(90deg, var(--side-b-deep), var(--side-b)); }

  .bar-labels{ display:flex; justify-content:space-between; font-size:13px; font-weight:600; }
  .bar-labels .a{ color:var(--side-a-deep); }
  .bar-labels .b{ color:var(--side-b-deep); }
  .bar-labels .n{ font-weight:400; color:var(--faint); font-family:'JetBrains Mono', monospace; font-size:11px; margin-left:5px; }

  /* ── Section headers ── */
  .section-head{ display:flex; justify-content:space-between; align-items:baseline; margin:36px 0 12px; flex-wrap:wrap; gap:8px; }
  .section-title{ font-family:'Big Shoulders Display', sans-serif; font-weight:700; font-size:20px; }
  .section-note{ font-size:12px; color:var(--faint); }

  .controls{ display:flex; gap:10px; margin-bottom:14px; flex-wrap:wrap; }
  .controls input, .controls select{
    font-family:'Inter'; font-size:13px; padding:8px 12px; border-radius:8px;
    border:1px solid var(--line); background:#fff; color:var(--ink);
  }
  .controls input{ flex:1; min-width:160px; }
  .controls input:focus, .controls select:focus{ outline:2px solid var(--side-a); outline-offset:1px; }

  /* ── County ledger ── */
  .ledger{ display:flex; flex-direction:column; gap:2px; }

  .county-row{
    display:grid; grid-template-columns:120px 1fr 92px; gap:14px; align-items:center;
    background:#fff; padding:11px 14px; border-radius:8px;
  }
  .county-row.empty{ opacity:0.55; }

  .county-name{ font-size:13.5px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  .diverging{ position:relative; height:22px; background:var(--paper); border-radius:5px; overflow:hidden; }
  .diverging .mid{ position:absolute; top:0; bottom:0; left:50%; width:1px; background:var(--line); }
  .diverging .fill-a{
    position:absolute; top:0; bottom:0; right:50%; background:linear-gradient(270deg, var(--side-a), var(--side-a-deep));
    border-radius:5px 0 0 5px;
  }
  .diverging .fill-b{
    position:absolute; top:0; bottom:0; left:50%; background:linear-gradient(90deg, var(--side-b-deep), var(--side-b));
    border-radius:0 5px 5px 0;
  }
  .diverging.no-votes .fill-a, .diverging.no-votes .fill-b{ display:none; }
  .diverging .dash{
    position:absolute; top:0; bottom:0; left:0; right:0;
    background-image:repeating-linear-gradient(45deg, var(--line) 0 4px, transparent 4px 9px);
    border-radius:5px;
  }

  .county-count{ font-family:'JetBrains Mono', monospace; font-size:11px; color:var(--muted); text-align:right; white-space:nowrap; }
  .county-count .tot{ color:var(--faint); }

  .no-results{ text-align:center; padding:40px 0; color:var(--faint); font-size:13px; }

  .legend{ display:flex; gap:18px; font-size:11.5px; color:var(--muted); margin-top:10px; }
  .legend span{ display:inline-flex; align-items:center; gap:6px; }
  .legend i{ width:9px; height:9px; border-radius:2px; display:inline-block; }
  .legend .a i{ background:var(--side-a); }
  .legend .b i{ background:var(--side-b); }

  .status{ text-align:center; margin-top:26px; font-size:12px; color:var(--faint); min-height:16px; }

  @media (max-width:520px){
    .county-row{ grid-template-columns:88px 1fr 74px; gap:8px; padding:9px 10px; }
    .county-name{ font-size:12px; }
    .county-count{ font-size:10px; }
  }
</style>
</head>
<body>

<div class="wrap">
  <a class="back" href="#" id="backLink">&larr; Back to the poll</a>
  <div class="eyebrow">Live results — by county</div>
  <h1>One Term or Two?<br>The Breakdown</h1>

  <div class="banner" id="banner">
    <div class="banner-top">
      <span class="banner-call">National tally</span>
      <span class="banner-total" id="bannerTotal">0 votes</span>
    </div>
    <div class="banner-winner tie" id="bannerWinner">Waiting for votes…</div>
    <div class="bar-track">
      <div class="bar-a" id="natBarA" style="width:50%"></div>
      <div class="bar-b" id="natBarB" style="width:50%"></div>
    </div>
    <div class="bar-labels">
      <span class="a">One term<span class="n" id="natNA">0</span></span>
      <span class="b">Two terms<span class="n" id="natNB">0</span></span>
    </div>
  </div>

  <div class="section-head">
    <span class="section-title">County leaderboard</span>
    <span class="section-note" id="countyMeta">sorted by lean, strongest "one term" first</span>
  </div>

  <div class="controls">
    <input type="text" id="searchBox" placeholder="Filter by county…">
    <select id="sortSelect">
      <option value="lean">Sort: strongest lean first</option>
      <option value="votes">Sort: most votes first</option>
      <option value="alpha">Sort: A–Z</option>
    </select>
  </div>

  <div class="ledger" id="ledger"></div>
  <div class="no-results" id="noResults" style="display:none;">No counties match that filter.</div>

  <div class="legend">
    <span class="a"><i></i>One term</span>
    <span class="b"><i></i>Two terms</span>
  </div>

  <div class="status" id="status">Connecting…</div>
</div>

<script type="module">
  // Same Firebase project as the poll page — this view only reads.
  const firebaseConfig = {
    apiKey: "AIzaSyDeUJhRnpqvRq68NmMysW3VFPAjhKN-L2M",
    authDomain: "political-analysis-dffae.firebaseapp.com",
    projectId: "political-analysis-dffae",
    storageBucket: "political-analysis-dffae.firebasestorage.app",
    messagingSenderId: "451202956995",
    appId: "1:451202956995:web:4d40c23c9d71ab4a0aac76",
    measurementId: "G-7XNMD4TJG3"
  };

  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const KENYA_COUNTIES = [
    "Mombasa","Kwale","Kilifi","Tana River","Lamu","Taita-Taveta","Garissa","Wajir","Mandera",
    "Marsabit","Isiolo","Meru","Tharaka-Nithi","Embu","Kitui","Machakos","Makueni","Nyandarua",
    "Nyeri","Kirinyaga","Murang'a","Kiambu","Turkana","West Pokot","Samburu","Trans Nzoia",
    "Uasin Gishu","Elgeyo-Marakwet","Nandi","Baringo","Laikipia","Nakuru","Narok","Kajiado",
    "Kericho","Bomet","Kakamega","Vihiga","Bungoma","Busia","Siaya","Kisumu","Homa Bay","Migori",
    "Kisii","Nyamira","Nairobi"
  ];

  const el = {
    banner: document.getElementById('banner'),
    bannerTotal: document.getElementById('bannerTotal'),
    bannerWinner: document.getElementById('bannerWinner'),
    natBarA: document.getElementById('natBarA'),
    natBarB: document.getElementById('natBarB'),
    natNA: document.getElementById('natNA'),
    natNB: document.getElementById('natNB'),
    ledger: document.getElementById('ledger'),
    noResults: document.getElementById('noResults'),
    countyMeta: document.getElementById('countyMeta'),
    searchBox: document.getElementById('searchBox'),
    sortSelect: document.getElementById('sortSelect'),
    status: document.getElementById('status'),
    backLink: document.getElementById('backLink'),
  };

  el.backLink.addEventListener('click', (e) => { e.preventDefault(); history.back(); });

  let allVotes = [];
  let filterText = '';
  let sortMode = 'lean';

  el.searchBox.addEventListener('input', (e) => { filterText = e.target.value.trim().toLowerCase(); renderLedger(); });
  el.sortSelect.addEventListener('change', (e) => { sortMode = e.target.value; renderLedger(); });

  function countyStats(){
    const map = new Map();
    KENYA_COUNTIES.forEach(c => map.set(c, { county: c, one: 0, two: 0 }));
    // include "Prefer not to say" and any county not in the base list defensively
    allVotes.forEach(v => {
      if(!v.county) return;
      if(!map.has(v.county)) map.set(v.county, { county: v.county, one: 0, two: 0 });
      const rec = map.get(v.county);
      if(v.choice === 'one') rec.one++;
      else if(v.choice === 'two') rec.two++;
    });
    return Array.from(map.values()).map(r => {
      const total = r.one + r.two;
      const pctA = total === 0 ? null : r.one / total;
      // lean: -1 fully "two terms" .. +1 fully "one term", weighted so counties with more votes
      // don't get buried by a single vote — margin scaled by total for sort stability
      const lean = total === 0 ? 0 : (r.one - r.two) / total;
      return { ...r, total, pctA, lean };
    });
  }

  function renderBanner(){
    const one = allVotes.filter(v => v.choice === 'one').length;
    const two = allVotes.filter(v => v.choice === 'two').length;
    const total = one + two;
    const pctA = total === 0 ? 50 : Math.round((one/total)*100);
    const pctB = total === 0 ? 50 : 100 - pctA;

    el.bannerTotal.textContent = total + (total === 1 ? ' vote' : ' votes');
    el.natBarA.style.width = pctA + '%';
    el.natBarB.style.width = pctB + '%';
    el.natNA.textContent = one;
    el.natNB.textContent = two;

    el.banner.classList.remove('lead-a', 'lead-b');
    el.bannerWinner.classList.remove('a', 'b', 'tie');

    if(total === 0){
      el.bannerWinner.textContent = 'Waiting for votes…';
      el.bannerWinner.classList.add('tie');
    } else if(one === two){
      el.bannerWinner.textContent = 'Dead even';
      el.bannerWinner.classList.add('tie');
    } else if(one > two){
      const margin = one - two;
      el.bannerWinner.innerHTML = `One term is leading <span class="margin">by ${margin} vote${margin===1?'':'s'} · ${pctA}%</span>`;
      el.bannerWinner.classList.add('a');
      el.banner.classList.add('lead-a');
    } else {
      const margin = two - one;
      el.bannerWinner.innerHTML = `Two terms is leading <span class="margin">by ${margin} vote${margin===1?'':'s'} · ${pctB}%</span>`;
      el.bannerWinner.classList.add('b');
      el.banner.classList.add('lead-b');
    }
  }

  function renderLedger(){
    let rows = countyStats();

    if(filterText){
      rows = rows.filter(r => r.county.toLowerCase().includes(filterText));
    }

    if(sortMode === 'lean'){
      rows.sort((a,b) => b.lean - a.lean || b.total - a.total);
      el.countyMeta.textContent = 'sorted by lean, strongest "one term" first';
    } else if(sortMode === 'votes'){
      rows.sort((a,b) => b.total - a.total);
      el.countyMeta.textContent = 'sorted by turnout, most votes first';
    } else {
      rows.sort((a,b) => a.county.localeCompare(b.county));
      el.countyMeta.textContent = 'sorted alphabetically';
    }

    el.ledger.innerHTML = '';
    el.noResults.style.display = rows.length === 0 ? 'block' : 'none';

    rows.forEach(r => {
      const row = document.createElement('div');
      row.className = 'county-row' + (r.total === 0 ? ' empty' : '');

      const pctA = r.total === 0 ? 0 : r.pctA * 100;
      const pctB = 100 - pctA;
      // width of each fill relative to the stronger side, scaled 0–50% from center
      const widthA = r.total === 0 ? 0 : (pctA / 100) * 50;
      const widthB = r.total === 0 ? 0 : (pctB / 100) * 50;

      row.innerHTML = `
        <div class="county-name" title="${r.county}">${r.county}</div>
        <div class="diverging ${r.total === 0 ? 'no-votes' : ''}">
          ${r.total === 0 ? '<div class="dash"></div>' : `
            <div class="fill-a" style="width:${widthA}%"></div>
            <div class="fill-b" style="width:${widthB}%"></div>
            <div class="mid"></div>
          `}
        </div>
        <div class="county-count">${r.total === 0 ? 'no votes' : `${r.one}–${r.two} <span class="tot">·${r.total}</span>`}</div>
      `;
      el.ledger.appendChild(row);
    });
  }

  function renderAll(){ renderBanner(); renderLedger(); }

  async function init(){
    if(firebaseConfig.apiKey === "YOUR_API_KEY"){
      el.status.textContent = 'Add your Firebase config in the script to activate this view.';
      return;
    }

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    onSnapshot(collection(db, 'votes'), (snap) => {
      allVotes = snap.docs.map(d => d.data());
      renderAll();
      el.status.textContent = '';
    }, (err) => {
      console.error(err);
      el.status.textContent = 'Could not load results — check Firestore read rules.';
    });

    try{
      await signInAnonymously(auth);
    }catch(e){
      console.error(e);
      el.status.textContent = 'Could not connect — check that Anonymous Auth is enabled.';
    }
  }

  init();
</script>

</body>
</html>
